name: release
# Builds the six binaries in parallel (one runner each), signs them when
# the signing secrets are set, packages them with scripts/package-release.sh,
# drafts the GitHub release, adds the Windows installers, then publishes it.
# Pass dry_run to build and package without touching any release. See
# docs/RELEASING.md for the secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true
      dry_run:
        description: "Build and package only; upload dist as a run artifact"
        type: boolean
        default: false
      publish:
        description: "Publish the release when it is complete (off = leave a draft)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "::error::tag '$tag' must look like v1.2.3"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOEXPERIMENT: greenteagc
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          commit=$(git rev-parse --short HEAD)
          pkg=github.com/charmbracelet/crush/internal/version
          ext=; [ "$GOOS" = windows ] && ext=.exe
          mkdir -p bin
          go build -trimpath \
            -ldflags "-s -w -X $pkg.Version=$VERSION -X $pkg.Commit=$commit -X $pkg.BuildID=$commit" \
            -o "bin/tada_${GOOS}_${GOARCH}${ext}" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      # The workflow's own commit (the tag itself on a tag push): its
      # packaging script and CHANGELOG.md also work for older tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: bin

      # Signing happens before packaging so the archives and SHA256SUMS.txt
      # cover the signed binaries. Each step skips with a notice when its
      # secrets are not set (see docs/RELEASING.md).
      - name: Sign and notarize macOS binaries
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          RCODESIGN_VERSION: "0.29.0"
          RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ]; then
            echo "::notice::macOS signing skipped: APPLE_CERT_P12_BASE64 is not set"
            exit 0
          fi
          # rcodesign (indygreg/apple-platform-rs) signs and notarizes Mach-O
          # binaries on Linux. Pinned release, checked against its SHA-256.
          name="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          tools="$RUNNER_TEMP/rcodesign"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/$name.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/$name.tar.gz"
          echo "$RCODESIGN_SHA256  $tools/$name.tar.gz" | sha256sum -c -
          tar -xzf "$tools/$name.tar.gz" -C "$tools"
          RCODESIGN="$tools/$name/rcodesign" bash scripts/sign-macos.sh bin

      - name: Sign Windows binaries
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if [ -z "$WINDOWS_CERT_PFX_BASE64" ]; then
            echo "::notice::Windows signing skipped: WINDOWS_CERT_PFX_BASE64 is not set"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          bash scripts/sign-windows.sh bin/tada_windows_amd64.exe bin/tada_windows_arm64.exe

      - name: Archives and checksums
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          bash scripts/package-release.sh "$VERSION" bin dist
          ls -l dist

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; found = index($0, "[" ver "]") > 0; next }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<EOT

          ## Downloads

          | Platform | File |
          |---|---|
          | Windows x64 installer (recommended) | \`tada_${VERSION}_Windows_x86_64_Setup.exe\` |
          | Windows ARM64 installer | \`tada_${VERSION}_Windows_arm64_Setup.exe\` |
          | Windows x64 (portable zip) | \`tada_${VERSION}_Windows_x86_64.zip\` |
          | Windows ARM64 (portable zip) | \`tada_${VERSION}_Windows_arm64.zip\` |
          | macOS Apple silicon | \`tada_${VERSION}_Darwin_arm64.tar.gz\` |
          | macOS Intel | \`tada_${VERSION}_Darwin_x86_64.tar.gz\` |
          | Linux x64 | \`tada_${VERSION}_Linux_x86_64.tar.gz\` |
          | Linux ARM64 | \`tada_${VERSION}_Linux_arm64.tar.gz\` |

          The Windows installer needs no admin rights: it installs to
          \`%LOCALAPPDATA%\\Programs\\Ta-Da\`, adds \`tada\` to your PATH, adds a
          Start menu entry, and uninstalls from Settings > Apps.

          Verify a download against \`SHA256SUMS.txt\`:
          \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\` (macOS/Linux) or
          \`Get-FileHash tada_${VERSION}_Windows_x86_64_Setup.exe\` (PowerShell).
          EOT
          cp "$RUNNER_TEMP/notes.md" dist/notes.md
          echo "--- notes.md"; cat dist/notes.md

      - name: Upload dist (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

      - name: Draft the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          pre=; case "$VERSION" in *-*) pre=--prerelease ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run: refresh the assets of the existing release.
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --draft --verify-tag $pre \
              --title "v$VERSION" --notes-file dist/notes.md \
              dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
          fi

      - name: Summary
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          {
            echo "## Release $TAG"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows-installer:
    needs: [meta, package]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/windows-installer.yml
    # For WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD.
    secrets: inherit
    with:
      tag: ${{ needs.meta.outputs.tag }}
      # Tag pushes always publish; a manual run can leave a draft.
      publish: ${{ github.event_name == 'push' || inputs.publish }}

  # Runs once the release is public, so the download URLs in the manifests
  # work. Each push is skipped with a notice when its token is not set.
  package-managers:
    needs: [meta, windows-installer]
    if: ${{ !inputs.dry_run && (github.event_name == 'push' || inputs.publish) }}
    uses: ./.github/workflows/package-managers.yml
    # For HOMEBREW_TAP_TOKEN, SCOOP_BUCKET_TOKEN and WINGET_TOKEN.
    secrets: inherit
    with:
      tag: ${{ needs.meta.outputs.tag }}
