# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Local snapshot builds only. Real releases are built by
# .github/workflows/release.yml (one runner per platform) and packaged by
# scripts/package-release.sh, which keeps the same archive layout as this file.
#
#   goreleaser build --snapshot --clean --single-target   # current platform
#   goreleaser release --snapshot --clean                  # all archives in dist/
version: 2

project_name: tada

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

before:
  hooks:
    - go mod tidy
    - rm -rf completions
    - mkdir completions
    - rm -rf manpages
    - mkdir manpages
    - sh -c 'go run . completion bash >./completions/tada.bash'
    - sh -c 'go run . completion zsh >./completions/tada.zsh'
    - sh -c 'go run . completion fish >./completions/tada.fish'
    - sh -c 'go run . man | gzip -c >./manpages/tada.1.gz'

builds:
  - env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w
      - -X github.com/charmbracelet/crush/internal/version.Version={{.Version}}
      - -X github.com/charmbracelet/crush/internal/version.Commit={{.ShortCommit}}
      - -X github.com/charmbracelet/crush/internal/version.BuildID={{.ShortCommit}}
    flags:
      - -trimpath

archives:
  - name_template: >-
      tada_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*

checksum:
  name_template: "SHA256SUMS.txt"

release:
  draft: true
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  disable: true
